function art(n){return `<span class="atlas-art" style="background-position:${(n%3)*50}% ${Math.floor(n/3)*100}%" aria-hidden="true"></span>`}
function artFor(i){return i>=3&&i<=5?1:i>=6&&i<=7?2:i>=8&&i<=11?0:[0,1,4,3,5][DATA[i][0]]}
let state={scores:{},notes:{},observations:{},name:''},selectedSection=-1,query='',current=-1,observed=false;

const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(storageKey(),JSON.stringify(state))}catch(e){toast('Браузер сақтауға рұқсат бермеді. Дәптерді жүктеп ал.')}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hide');setTimeout(()=>el.classList.add('hide'),3500)}
function nav(x){['home','labs','notes'].forEach(n=>document.getElementById('nav'+n).classList.toggle('active',n===x));window.scrollTo(0,0)}
function stats(){return `<div class="stats"><div class="stat"><span class="round">◈</span><div><b>5</b><small>зерттеу бөлімі</small></div></div><div class="stat"><span class="round">⚗</span><div><b>34</b><small>интерактивті жұмыс</small></div></div><div class="stat"><span class="round">⭐</span><div><b>${Object.values(state.scores).filter(x=>x===2).length} / 34</b><small>толық орындалды</small></div></div></div>`}
function home(){nav('home');app.innerHTML=`<section class="hero"><img src="${HERO}" alt="Көңілді үшөлшемді робот, жасыл өскін және зертхана құралдары"><div class="herotext"><span class="tag">✦ ЖАС ЗЕРТТЕУШІЛЕРГЕ АРНАЛҒАН</span><h1>Үлкен жаңалық<br><span>кішкентай сұрақтан</span> басталады.</h1><p>Бақыла, тәжірибе жаса, жаңалық аш. Сенің алғашқы цифрлық зертханаңа қош келдің!</p><div class="actions"><button onclick="openLab(0)">🚀 Зерттеуді бастайық!</button><button class="ghost" onclick="catalog()">Барлық бөлімдер</button></div></div></section>${stats()}<section class="discovery"><div><h3>🎲 Бүгін қандай жаңалық ашасың?</h3><p>Құпия тәжірибені таңдап, өзіңді зерттеуші ретінде сына!</p></div><button onclick="surprise()">✨ Маған тәжірибе таңда!</button></section><div class="sectionhead"><div><span class="eyebrow">СЕНІҢ ҒЫЛЫМҒА САЯХАТЫҢ</span><h2>Қай әлемді зерттейміз?</h2></div><span class="note">Оқулықтағы 5 бөлім бойынша</span></div><div class="grid">${sections.map((s,i)=>`<article class="card"><div class="cardtop" style="--tint:${colors[i]}">${art([0,1,4,3,5][i])}<span class="badge">${DATA.filter(d=>d[0]===i).length} жұмыс</span></div><small style="margin-top:18px">0${i+1} БӨЛІМ</small><h3>${s}</h3><p>${['Сұрақ қоюдан алғашқы тәжірибеге дейін.','Өсімдіктер, жануарлар және өз денең.','Ауа мен судың таңғажайып қасиеттері.','Күн, ғаламшарлар және жыл мезгілдері.','Қозғалыс, жарық, дыбыс және магнит.'][i]}</p><button onclick="catalog(${i})">Зертте! <span>🚀</span></button></article>`).join('')}</div><section class="guide"><div><span class="eyebrow" style="color:#bcd7ba">ҒЫЛЫМ ЖАСАУ ОҢАЙ</span><h2>Сен де зерттеушісің!</h2><p>Қателесуден қорықпа. Әр тәжірибе — жаңа білім.</p></div><div class="steps"><div><b>01</b><h3>Болжам жаса</h3><p>Не болады деп ойлайсың? Ойыңды жаз.</p></div><div><b>02</b><h3>Өзің сына</h3><p>Шарттарды өзгертіп, нәтижені бақыла.</p></div><div><b>03</b><h3>Біліміңді тексер</h3><p>Тапсырмаларды орындап, түсіндірмесін оқы.</p></div></div></section><details class="panel"><summary>Мұғалімге және ата-анаға</summary><p>Дереккөз: Ж.Т. Сүйіндікова және авторлар ұжымы. «Жаратылыстану», 2-сынып. Алматыкітап баспасы, 2023. Сайттағы бет сілтемелері кітаптың баспа нөмірлеріне сәйкес келеді. Кітаптың 34 тақырыбы негізінде авторлық цифрлық бейімдеулер жасалды; барлық тақырып оқулықта жеке зертханалық жұмыс деп аталмайды.</p><p>Модельдер құбылысты түсіндіруге арналған. Нақты өлшеулер тәжірибе жағдайына байланысты өзгереді. Қыздыруды, шыны және электр құралдарын нақты өмірде ересекпен бірге қолдану қажет.</p><p>«AI» — жоба атауы. Көмек пен тексеру алдын ала дайындалған ережелерге сүйенеді; сыртқы жасанды интеллект сервисіне дерек жіберілмейді. Жауаптар браузерде сақталады және тапсырған кезде мұғалімге жіберіледі.</p></details>`}
function catalog(s=-1){selectedSection=s;query='';nav('labs');app.innerHTML=`<div class="sectionhead"><div><span class="eyebrow">ЗЕРТТЕ · СЫНА · ТҮСІН</span><h2>Зертханалар кітапханасы</h2><p>Кез келген тақырыптан бастауға болады.</p></div><input class="search" aria-label="Тақырыпты іздеу" placeholder="⌕ Тақырыпты іздеу…" oninput="query=this.value;renderCards()"></div><div class="filters" id="filters"></div><div class="grid" id="cards"></div>`;renderCards()}
function filter(s){selectedSection=s;renderCards()}
